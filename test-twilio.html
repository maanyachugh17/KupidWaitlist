<!DOCTYPE html>
<html>
<head>
    <title>Test Twilio</title>
</head>
<body>
    <h1>Test Twilio SMS</h1>
    <p>This will test if your Twilio credentials work by sending a test SMS.</p>
    <input type="text" id="phoneNumber" placeholder="Enter your phone number (+1234567890)" style="width: 300px; padding: 10px;">
    <button onclick="testTwilio()">Send Test SMS</button>
    <div id="result"></div>

    <script>
        async function testTwilio() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            if (!phoneNumber) {
                alert('Please enter a phone number');
                return;
            }

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'send_code');
                formData.append('name', 'Test User');
                formData.append('phone', phoneNumber);

                document.getElementById('result').innerHTML = '<p>Sending test SMS...</p>';

                const response = await fetch('https://script.google.com/macros/s/AKfycbxzV4rU-y0EsVwRr_0tSozAaBfjvNdQr87NrA8gRGZ3YiYDq-u-A731egGtUdHnxmHw/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                document.getElementById('result').innerHTML = '<p>✅ Test SMS request sent! Check your phone for a verification code.</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p>❌ Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
